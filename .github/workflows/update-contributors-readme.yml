name: Update contributor roster

on:
  push:
    branches:
      - main
    paths:
      - 'contributors.json'
      - 'scripts/update-contributors-readme.mjs'
      - 'README.md'
  pull_request:
    branches:
      - main
    paths:
      - 'contributors.json'
      - 'scripts/update-contributors-readme.mjs'
      - 'README.md'

permissions:
  contents: write

jobs:
  refresh-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh contributor section
        run: node scripts/update-contributors-readme.mjs

      - name: Commit README updates
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'docs: sync contributor roster from contributors.json'
          file_pattern: 'README.md'